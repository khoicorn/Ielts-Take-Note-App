<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A private notebook for your IELTS corrections, with spaced review." />
    <meta name="theme-color" content="#EBE1CC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191511" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>IELTS Upgrade Notebook</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the wrong colors.
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('ielts-theme') || 'system'
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
