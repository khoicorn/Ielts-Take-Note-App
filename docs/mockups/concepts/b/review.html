<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review · Reveal · Concept B</title>
<meta name="description" content="Concept B, Midnight Observatory: review state 2 with the same content as 05-review-revealed. The revealed answer sits on a lifted lens surface. Under 640px it uses the phone layout from m02-review-mobile.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept.css">
<style>
  /* ---------- Review screen. Full screen: no sidebar. Layout as 05-review-revealed. ---------- */
  .rv { display: flex; flex-direction: column; min-height: 100vh; }

  /* The sky starts under the top bar, so the bar text never sits on the dense stars */
  body::before { top: 57px; }

  /* Quiet top bar. Its bottom hairline is the track; the gold line is the progress. */
  .rv-bar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 56px;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
  }
  .rv-progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--gold); }
  .rv-end { justify-self: start; margin-left: -8px; padding: 0 10px 0 8px; }
  .rv-end .kbd { margin-left: 4px; }
  .rv-count { font-size: 13px; line-height: 1.5; color: var(--graphite); font-variant-numeric: tabular-nums; }
  .rv-type { justify-self: end; font-size: 13px; line-height: 1.5; color: var(--graphite); }

  /* One item at a time, in a 720px column. The action row stays at the same height in both states. */
  .rv-stage {
    display: flex;
    flex: 1;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 0 64px;
  }
  .rv-card { display: flex; flex-direction: column; min-height: 600px; }
  .rv-heading {
    margin-top: 16px;
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.35;
    color: var(--ink);
  }
  .rv-block { margin-top: 36px; }
  .rv-block .label-caps { margin-bottom: 10px; }

  /* Thin rule on the left of each sentence: crimson for what I said, upgrade green for the answer.
     The rule and the opening quote hang in the margin, so every line starts on one edge. */
  .rv-ruled { position: relative; overflow-wrap: anywhere; text-indent: -0.36em; }
  .rv-ruled::before {
    content: "";
    position: absolute;
    top: 0.22em;
    bottom: 0.22em;
    left: -24px;
    width: 2px;
    border-radius: var(--r-full);
    background: var(--crimson);
  }
  .rv-said-small { font-size: 16px; line-height: 1.65; color: var(--crimson); }

  /* ---------- The lens: everything that was revealed ---------- */
  .lens { margin-top: 32px; margin-left: -32px; margin-right: -32px; padding: 28px 32px 16px; }
  .lens .label-caps { margin-bottom: 10px; }
  /* The answer: serif, like a quoted line in a good book. Larger than the mistake by far. */
  .rv-better {
    font-family: var(--font-serif);
    font-size: 38px;
    font-weight: 400;
    line-height: 1.18;
    letter-spacing: -0.005em;
    color: var(--upgrade);
    text-indent: -0.3em;
  }
  .rv-better::before { left: -24px; top: 0.16em; bottom: 0.12em; background: var(--upgrade); }
  .rv-context-block { margin-top: 28px; }
  .rv-context-block .label-caps { margin-bottom: 8px; }
  .rv-context { font-size: 16px; line-height: 1.65; color: var(--ink); }
  .rv-context strong { font-weight: 600; }

  .rv-why {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    margin-top: 16px;
    margin-left: -8px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    font-size: 13px;
    line-height: 1.5;
    color: var(--graphite);
  }
  .rv-why .icon { width: 14px; height: 14px; }
  .rv-why:hover { background: var(--hover); color: var(--ink); }

  .rv-spacer { flex: 1; min-height: 40px; }
  .rv-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    height: 85px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .rv-hint { font-size: 13px; line-height: 1.5; color: var(--graphite); }

  /* Ratings: compact, all the same weight. Key and next gap in small text. Good has the default focus. */
  .rate-row { display: flex; gap: 8px; }
  .rate {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    width: 120px;
    height: 60px;
    padding: 0 12px 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--paper);
    text-align: left;
  }
  .rate:hover { background: color-mix(in srgb, var(--stone) 70%, var(--paper)); }
  .rate-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rate-name { font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--ink); }
  .rate-gap { font-size: 12px; line-height: 1.45; color: var(--graphite); }

  .safe-area { display: none; }

  /* ---------- Phone (under 640px): the layout of m02-review-mobile ---------- */
  @media (max-width: 639px) {
    .rv-bar { padding: 0 16px 0 6px; }
    .rv-end { width: 44px; height: 44px; min-height: 44px; margin-left: 0; padding: 0; }
    .rv-end .icon { width: 20px; height: 20px; }
    .rv-end .kbd { display: none; }
    .rv-end-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .rv-type { font-size: 12px; line-height: 1.45; }

    .rv-stage { padding: 28px 24px 0; }
    .rv-card { flex: 1; min-height: 0; }
    .rv-heading { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .rv-block { margin-top: 28px; }
    .rv-block .label-caps { margin-bottom: 8px; }
    .rv-ruled::before { left: -14px; }

    /* The lens is a little wider than the text column; its content is inset so the
       green rule has room to hang without touching the opening quote. */
    .lens { margin: 24px -16px 0; padding: 20px 16px 4px 30px; }
    .rv-better { font-size: 32px; line-height: 1.2; }
    .rv-better::before { left: -19px; }
    .rv-context-block { margin-top: 22px; }
    .rv-why { height: 44px; margin-top: 4px; margin-left: -10px; padding: 0 10px; }

    .rv-spacer { min-height: 24px; }
    .rv-actions {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      height: auto;
      margin: 0 -24px;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .rv-hint { text-align: center; }
    .rate-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .rate { width: auto; height: 48px; padding: 0; align-items: center; gap: 1px; text-align: center; }
    .rate-top { justify-content: center; }
    .rate .kbd { display: none; }
    .rate-name { line-height: 1.2; }
    .rate-gap { line-height: 1.2; }

    /* Mockup only: the iPhone home indicator area (34px), to show the safe area. Not app UI. */
    .safe-area { display: flex; align-items: flex-end; justify-content: center; height: 34px; padding-bottom: 8px; }
    .safe-area::after { content: ""; width: 134px; height: 5px; border-radius: var(--r-full); background: color-mix(in srgb, var(--ink) 28%, transparent); }
  }
</style>
</head>
<body>
<div class="rv">
  <header class="rv-bar">
    <button class="btn btn-ghost btn-sm rv-end" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span class="rv-end-text">End review</span><kbd class="kbd" aria-hidden="true">Esc</kbd></button>
    <p class="rv-count"><span class="sr-only">Note </span>3 of 12</p>
    <p class="rv-type">Mistake → Upgrade</p>
    <div class="rv-progress" style="width: 25%" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="12" aria-valuenow="3"></div>
  </header>

  <main class="rv-stage" id="main">
    <div class="rv-card">
      <p class="meta-line"><span class="mode mode-speaking"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>Speaking</span><span class="sep" aria-hidden="true">·</span><span>Travel</span><span class="sep" aria-hidden="true">·</span><span class="must"><span class="star" aria-hidden="true"></span>Must Remember</span></p>
      <h1 class="rv-heading">Recall the better version</h1>

      <div class="rv-block">
        <p class="label-caps">What I said</p>
        <p class="rv-ruled rv-said-small"><span class="quote">We enjoyed the scenario.</span></p>
      </div>

      <section class="lens anim-lens" aria-label="Answer">
        <p class="label-caps mark-star">Better English</p>
        <p class="rv-ruled rv-better anim-ink"><span class="quote">The scenery was beautiful.</span></p>

        <div class="rv-context-block anim-ink">
          <p class="label-caps">In context</p>
          <p class="rv-context">The <strong>scenery</strong> along the coast was beautiful.</p>
        </div>

        <div><button class="rv-why" type="button" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>Why</button></div>
      </section>

      <div class="rv-spacer"></div>

      <div class="rv-actions">
        <p class="rv-hint" id="rate-q">How well did you recall it?</p>
        <div class="rate-row" role="group" aria-labelledby="rate-q">
          <button class="rate" type="button"><span class="rate-top"><span class="rate-name">Again</span><kbd class="kbd" aria-hidden="true">1</kbd></span><span class="rate-gap">Tomorrow</span></button>
          <button class="rate" type="button"><span class="rate-top"><span class="rate-name">Hard</span><kbd class="kbd" aria-hidden="true">2</kbd></span><span class="rate-gap">2 days</span></button>
          <button class="rate is-focus" type="button"><span class="rate-top"><span class="rate-name">Good</span><kbd class="kbd" aria-hidden="true">3</kbd></span><span class="rate-gap">1 week</span></button>
          <button class="rate" type="button"><span class="rate-top"><span class="rate-name">Easy</span><kbd class="kbd" aria-hidden="true">4</kbd></span><span class="rate-gap">2 weeks</span></button>
        </div>
      </div>
    </div>
  </main>
  <div class="safe-area" aria-hidden="true"></div>
</div>
</body>
</html>
